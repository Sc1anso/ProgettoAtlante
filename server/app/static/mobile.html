<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Carica video · Progetto ATLANTE</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .mobile-main{width:min(600px,calc(100% - 28px));padding-top:30px}.mobile-main .card{margin-top:22px}.mobile-status{min-height:28px;margin-top:14px}.mobile-source-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}.mobile-source-actions label{display:grid;place-items:center;min-height:46px;padding:9px 13px;border:1px solid #40527b;border-radius:8px;background:#202d4b;color:#eef2ff;text-align:center;cursor:pointer;transition:transform .15s ease,background .15s ease,border-color .15s ease,box-shadow .15s ease}.mobile-source-actions label:hover{transform:translateY(-1px);border-color:#9b8dff;background:#2d3d64;box-shadow:0 5px 16px #0004}.mobile-source-actions label:focus-within{outline:3px solid #b8adff;outline-offset:2px}.mobile-source-actions input{position:absolute;inline-size:1px;block-size:1px;opacity:0;pointer-events:none}.mobile-file-name{min-height:24px;margin:10px 0 0;color:#b8c6eb}.mobile-security-note{margin-top:10px}@media(max-width:430px){.mobile-source-actions{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="mobile-main">
    <header class="hero">
      <div class="brand-mark" aria-hidden="true">ATL</div>
      <div><p class="eyebrow">UPLOAD MOBILE</p><h1>Carica il video</h1><p class="hero-copy">Scegli un video dalla galleria oppure registrane uno. L’elaborazione continuerà sul server.</p></div>
    </header>
    <section class="card acquisition">
      <form id="mobile-upload">
        <label class="field-label">Qualità della ricostruzione
          <select id="mobile-quality">
            <option value="fast">Rapida — anteprima</option>
            <option value="balanced" selected>Bilanciata — consigliata</option>
            <option value="high">Alta — più lenta</option>
            <option value="very_high">Molto alta — 4 FPS, massima qualità</option>
          </select>
        </label>
        <p class="field-label">Video</p>
        <div class="mobile-source-actions" role="group" aria-label="Sorgente del video">
          <label class="button" for="mobile-gallery">Scegli dalla galleria<input id="mobile-gallery" type="file" accept="video/*"></label>
          <label class="button" for="mobile-camera">Registra video<input id="mobile-camera" type="file" accept="video/*" capture="environment"></label>
        </div>
        <p id="mobile-file-name" class="mobile-file-name" aria-live="polite">Nessun video selezionato.</p>
        <button id="mobile-submit" class="primary" type="submit" disabled>Invia video <span aria-hidden="true">→</span></button>
      </form>
      <p id="mobile-status" class="note mobile-status" aria-live="polite"></p>
      <p id="mobile-security-note" class="note mobile-security-note" hidden></p>
    </section>
  </main>
  <script type="module" src="/mobile.js?v=20260929-2"></script>
</body>
</html>
